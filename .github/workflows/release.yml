name: release

# Push a tag like v0.1.0 to build Ontomeme for Windows, macOS and Linux and
# publish the three downloads on a GitHub Release. The tag must match
# config/version in project.godot (without the leading "v"); a pre-release tag
# such as v0.1.0-rc1 is published as a GitHub pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Releases are built on the public repo only
    if: github.repository == 'voidlore/ontomeme'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' project.godot)"
          echo "tag=$tag project=$version"
          # v0.1.0 or a pre-release of it such as v0.1.0-rc1
          if [ "$tag" != "$version" ] && [ "${tag%%-*}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match config/version=\"$version\" in project.godot"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install Godot and export templates
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$dest/"
          ls "$dest"

      - name: Run tests
        run: tests/run_all.sh

      - name: Export
        run: |
          "$GODOT" --headless --path . --import >/dev/null 2>&1 || true
          mkdir -p build/linux build/windows build/macos
          export_one() {
            log="build/export-$(echo "$1" | tr ' ' '_').log"
            "$GODOT" --headless --path . --export-release "$1" "$2" 2>&1 | tee "$log"
            if [ ! -s "$2" ] || grep -qE '^ERROR|SCRIPT ERROR' "$log"; then
              echo "::error::Export of preset \"$1\" failed"
              exit 1
            fi
          }
          export_one "Linux x86_64"   build/linux/Ontomeme.x86_64
          export_one "Windows x86_64" build/windows/Ontomeme.exe
          export_one "macOS"          build/macos/Ontomeme.zip

      - name: Smoke-test the Linux build
        run: |
          # A real first run in a sandboxed home: no --vault, so the app
          # creates <Documents>/Ontomeme and seeds the starter content.
          t="$(mktemp -d)"
          mkdir -p "$t/config" "$t/data" "$t/Docs"
          echo "XDG_DOCUMENTS_DIR=\"$t/Docs\"" > "$t/config/user-dirs.dirs"
          XDG_CONFIG_HOME="$t/config" XDG_DATA_HOME="$t/data" \
            timeout 150 build/linux/Ontomeme.x86_64 --headless --quit-after 200 2>&1 | tee build/smoke.log
          if grep -qE 'SCRIPT ERROR|Parse Error' build/smoke.log; then
            echo "::error::The exported Linux build logged script errors"
            exit 1
          fi
          v="$t/Docs/Ontomeme"
          ls -R "$v"
          [ -d "$v/Tutorials" ] || { echo "::error::first run did not seed Tutorials/"; exit 1; }
          [ -f "$v/models/rocket.glb" ] || { echo "::error::first run did not write models/rocket.glb"; exit 1; }
          n="$(ls "$v/Memetics" | wc -l)"
          [ "$n" -eq 6 ] || { echo "::error::expected 6 Memetics notes, found $n"; exit 1; }

      - name: Install packaging tools
        run: |
          # squashfs-tools provides mksquashfs and file provides file(1), both
          # required by appimagetool; librsvg2-bin provides rsvg-convert (used
          # to rasterize the AppImage icon).
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools file librsvg2-bin

      - name: Package
        run: |
          mkdir -p dist
          v="$VERSION"
          # Windows: a single Ontomeme.exe inside a folder, zipped
          mkdir -p "pkg/Ontomeme-$v-windows"
          cp build/windows/Ontomeme.exe "pkg/Ontomeme-$v-windows/"
          (cd pkg && zip -qr "../dist/Ontomeme-$v-windows-x86_64.zip" "Ontomeme-$v-windows")
          # Linux: AppImage (AppDir + appimagetool); the script smoke-tests
          # the result (executable, squashfs payload).
          scripts/make_appimage.sh "$v" build/linux/Ontomeme.x86_64 \
            "dist/Ontomeme-$v-linux-x86_64.AppImage"
          # Checksums cover the artifacts this job publishes.
          (cd dist && sha256sum * > SHA256SUMS.txt)
          # The macOS .app ships to the macos-dmg job, which turns it into
          # the .dmg (hdiutil exists only on macOS runners) and appends the
          # .dmg's hash to this checksum list. Stage the export zip and the
          # checksums it will extend (SHA256SUMS.txt now exists, so the copy
          # is of the real file).
          mkdir -p "pkg/macos"
          cp build/macos/Ontomeme.zip "pkg/macos/Ontomeme.zip"
          cp dist/SHA256SUMS.txt "pkg/macos/SHA256SUMS.txt"
          # Each package, and the pack inside it, must hold only app code and
          # assets (scripts/check_pck_contents.sh); the .dmg is made from
          # this macOS zip.
          scripts/check_packages.sh dist "$v"
          scripts/check_pck_contents.sh pkg/macos/Ontomeme.zip
          ls -la dist

      - name: Upload macOS export for the dmg job
        uses: actions/upload-artifact@v4
        with:
          name: macos-export
          # The dmg job needs the exported .app zip AND the checksum list it
          # will extend, so upload the whole staging dir.
          path: pkg/macos

      - name: Create GitHub Release (a draft)
        uses: softprops/action-gh-release@v2
        with:
          name: Ontomeme ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # A draft nobody else sees until the macos-dmg job has added the
          # .dmg and publishes it: the body below and the README send Mac
          # users to a .dmg this job can't build. If macos-dmg fails, no
          # release goes out without a macOS download (RELEASING.md, "When
          # something goes wrong").
          draft: true
          generate_release_notes: true
          body: |
            Download the file for your computer below, then follow the
            [install steps](https://github.com/${{ github.repository }}#install).
            These builds are not signed yet, so Windows and macOS will warn you
            the first time you open Ontomeme; the install steps show how to
            open it anyway.

            - Windows: `Ontomeme-${{ env.VERSION }}-windows-x86_64.zip`
            - macOS (Apple Silicon and Intel): `Ontomeme-${{ env.VERSION }}-macos.dmg`
            - Linux: `Ontomeme-${{ env.VERSION }}-linux-x86_64.AppImage`
          files: |
            dist/*.zip
            dist/*.AppImage
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

  macos-dmg:
    # The .app is exported on the ubuntu runner (a universal binary covers
    # both Apple Silicon and Intel); only the .dmg needs a macOS runner,
    # because hdiutil is Apple tooling.
    needs: release
    if: github.repository == 'voidlore/ontomeme'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the macOS export
        uses: actions/download-artifact@v4
        with:
          name: macos-export
          path: pkg/macos

      - name: Build the .dmg
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd pkg/macos
          unzip -q Ontomeme.zip
          [ -d Ontomeme.app ] || { echo "::error::exported zip does not contain Ontomeme.app"; exit 1; }
          mkdir -p "pkg-staging/Ontomeme-$v"
          cp -R Ontomeme.app "pkg-staging/Ontomeme-$v/"
          ln -s /Applications "pkg-staging/Ontomeme-$v/Applications"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # hdiutil create fails now and then on hosted runners ("Resource
          # busy"): three tries.
          for attempt in 1 2 3; do
            if hdiutil create -volname "Ontomeme $v" -srcfolder "pkg-staging/Ontomeme-$v" \
                -ov -format UDBZ "$GITHUB_WORKSPACE/dist/Ontomeme-$v-macos.dmg"; then
              break
            fi
            [ "$attempt" -lt 3 ] || { echo "::error::hdiutil create failed 3 times"; exit 1; }
            echo "hdiutil create failed (try $attempt of 3); trying again in 15 s"
            sleep 15
          done
          # Complete the checksum list the release job started, so the
          # published SHA256SUMS.txt covers every artifact. shasum -a 256 is
          # macOS's own and prints the same "<hash>  <file>" line as sha256sum.
          cp SHA256SUMS.txt "$GITHUB_WORKSPACE/dist/"
          (cd "$GITHUB_WORKSPACE/dist" && shasum -a 256 "Ontomeme-$v-macos.dmg" >> SHA256SUMS.txt)

      - name: Verify the .dmg
        run: |
          v="${GITHUB_REF_NAME#v}"
          hdiutil verify "dist/Ontomeme-$v-macos.dmg"

      - name: Add the .dmg to the release and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release job left the release a draft. Add the .dmg and the
          # completed SHA256SUMS.txt (--clobber replaces the release job's),
          # then publish it. gh finds a draft by its tag; the body (the
          # downloads and the generated notes) is left as the release job
          # wrote it.
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "dist/Ontomeme-$v-macos.dmg" dist/SHA256SUMS.txt \
            --clobber -R "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets \
            --jq '"draft=\(.isDraft) prerelease=\(.isPrerelease) assets: \([.assets[].name] | join(", "))"'
