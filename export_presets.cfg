; Ontomeme export presets. Build with:
;   godot --headless --path . --export-release "<preset name>" <output path>
; Output goes under build/ (gitignored). The release workflow
; (.github/workflows/release.yml) runs the same three exports on v* tags.
;
; Packed: every app script/scene/resource at the repo root, fonts/,
; ontomeme-notes/ and mcp/ (when present). Dev-only folders are excluded.
; Loose .md files at the root are not resources, so they are never packed;
; do not add "*.md" to exclude_filter or the ontomeme-notes/ lessons drop out.

[preset.0]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="fonts/*, ontomeme-notes/*, mcp/*"
exclude_filter="tests/*, scripts/*, skills/*, .publish/*, .github/*, .agents/*, .claude/*, ~/*, build/*, note_test.tscn, note_minimal.tscn"
export_path="build/linux/Ontomeme.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

